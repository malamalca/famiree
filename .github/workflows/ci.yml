name: CI

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testsuite:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.4'
            dependencies: 'highest'

    steps:
    - uses: actions/checkout@v7

    - name: Setup MySQL
      uses: mirromutth/mysql-action@v1.1
      with:
        mysql version: 5.7
        mysql database: test_myapp
        mysql user: my_app
        mysql password: secret

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, intl, pdo_mysql, fileinfo, zip, iconv, gd
        ini-values: zend.assertions=1, session.save_path=/tmp
        coverage: none

    - name: Composer install
      uses: ramsey/composer-install@v4
      with:
        dependency-versions: ${{ matrix.dependencies }}

    - name: Execute post install cmd
      run: composer run-script setup --no-interaction

    - name: Run tests
      # tests/bootstrap.php builds the test schema with Migrator on the `test`
      # connection, so no separate migrations step is needed.
      run: composer test

  coding-standard:
    name: Coding Standard & Static Analysis
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, intl
        coverage: none
        tools: cs2pr

    - name: Composer install
      uses: ramsey/composer-install@v4

    - name: Run PHP CodeSniffer
      run: vendor/bin/phpcs --report=checkstyle | cs2pr

    - name: Run phpstan
      if: always()
      run: composer stan
